spring.application.name=digital-wallet-api

# Schema is owned by Flyway migrations; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Base64 HMAC key (32+ bytes) used to sign tokens. Never commit a real one: set the JWT_SECRET environment variable.
# Left empty, a random key is generated at startup (fine for local development).
wallet.jwt.secret=${JWT_SECRET:}
wallet.jwt.ttl=15m
