name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is now out of date
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Docker is preinstalled on GitHub's Ubuntu runners, so Testcontainers starts a real PostgreSQL here too
      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Proves the Dockerfile still builds and the image starts; nothing is published
      - name: Build image
        run: docker build -t digital-wallet-api .

      - name: Start app with its database and wait until healthy
        run: |
          docker compose --profile app up -d --wait --wait-timeout 120

      - name: Check health endpoint
        run: curl --fail --silent http://localhost:8080/actuator/health

      - name: Show app logs on failure
        if: failure()
        run: docker compose --profile app logs app
