services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=wallet'
      - 'POSTGRES_USER=wallet'
      - 'POSTGRES_PASSWORD=wallet'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet']
      interval: 5s
      timeout: 3s
      retries: 10

  # The packaged app. Only started with `docker compose --profile app up`, so `./mvnw spring-boot:run`
  # (which starts this file's default services) still runs just the database
  app:
    profiles: ['app']
    build: .
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/wallet'
      - 'SPRING_DATASOURCE_USERNAME=wallet'
      - 'SPRING_DATASOURCE_PASSWORD=wallet'
      - 'JWT_SECRET=${JWT_SECRET:-}'
    depends_on:
      postgres:
        condition: service_healthy
